spring:
  application:
    name: investory-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:investory}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# CORS 설정
# 배포 시 CORS_ALLOWED_ORIGINS 에 프론트엔드 도메인을 콤마로 구분해 넣는다.
# 예: https://investory.vercel.app,https://investory.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# Investory 도메인 정책 설정
investory:
  cash:
    # 회원가입 시 지급하는 초기 시드머니
    seed-money: ${SEED_MONEY:10000000}
    # cash 컬럼 도입 이전에 가입한 유저에게 소급 지급할지 여부 (DEPOSIT 이력 기준 멱등)
    backfill-existing-users: ${CASH_BACKFILL:true}

  order:
    # optimistic: @Version + @Retryable (기본)
    # pessimistic: SELECT ... FOR UPDATE  — 성능 비교 실험용
    lock-mode: ${ORDER_LOCK_MODE:optimistic}

  stock:
    simulator:
      enabled: ${SIMULATOR_ENABLED:true}
      interval-ms: ${SIMULATOR_INTERVAL_MS:5000}
      # 틱당 최대 변동률 (0.005 = ±0.5%)
      volatility: ${SIMULATOR_VOLATILITY:0.005}
      # 값을 주면 재현 가능한 시세 시퀀스가 만들어진다 (미지정 시 매 실행 랜덤).
      # 빈 문자열이 Long 으로 바인딩되며 생기는 모호함을 피하려고 기본은 아예 선언하지 않는다.
      # 필요 시 SIMULATOR_SEED 환경변수 대신 아래 줄의 주석을 해제해 사용한다.
      # seed: 20250101
      max-volume-per-tick: 100000

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-minimum-32-characters}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Swagger 설정
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# 로깅 설정
logging:
  level:
    root: INFO
    com.investory: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_LOG_LEVEL:TRACE}

---
# Local 프로파일
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

logging:
  level:
    com.investory: DEBUG

---
# Docker 프로파일
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false

logging:
  level:
    com.investory: INFO
    org.hibernate.SQL: WARN

---
# Production 프로파일
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      # 평소에는 validate 로 스키마 드리프트를 잡는다.
      # 최초 배포 때만 JPA_DDL_AUTO=update 로 한 번 띄워 테이블을 만든 뒤 되돌린다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false

logging:
  level:
    root: WARN
    com.investory: INFO
