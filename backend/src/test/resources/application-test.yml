spring:
  datasource:
    # H2 를 MySQL 호환 모드로 기동한다.
    # - 동시성 테스트에서 여러 커넥션이 동시에 붙으므로 DB_CLOSE_DELAY=-1 로 마지막 커넥션이 끊겨도 스키마를 유지한다.
    # - MODE=MySQL 로 방언 차이(예약어, AUTO_INCREMENT)를 최소화한다.
    url: jdbc:h2:mem:investory;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # 32스레드 동시성 테스트가 커넥션 고갈로 타임아웃 나지 않도록 풀을 넉넉히 잡는다.
      maximum-pool-size: 40
      minimum-idle: 5
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
    show-sql: false

  # 테스트에서는 Redis / Mail 을 쓰지 않으므로 자동 설정을 제외한다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

investory:
  cash:
    seed-money: 10000000
    # 테스트에서는 기존 유저 백필 러너가 돌지 않도록 끈다.
    backfill-existing-users: false
  stock:
    simulator:
      # 스케줄러가 테스트 도중 시세를 흔들면 검증이 불가능하므로 기본 비활성화한다.
      enabled: false
      interval-ms: 5000
      volatility: 0.005
      seed: 20250101

jwt:
  secret: test-secret-key-for-junit-only-minimum-32-characters-long-value
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

logging:
  level:
    root: WARN
    com.investory: INFO
    org.hibernate.SQL: WARN
